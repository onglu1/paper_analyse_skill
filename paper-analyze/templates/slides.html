<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        /* ===== CSS Variables for Theme ===== */
        :root {
            --primary-color: #4fc3f7;
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --heading-color: #ffffff;
            --accent-color: #ff6b6b;
            --code-bg: #2d2d44;
            --slide-max-width: 1100px;
            --transition-duration: 0.4s;
        }

        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ===== Slide Container ===== */
        .slide-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-duration) ease-in-out;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .slide-content {
            max-width: var(--slide-max-width);
            width: 100%;
        }

        /* ===== Typography ===== */
        h1 {
            font-size: 2.8em;
            color: var(--heading-color);
            margin-bottom: 0.5em;
            text-align: center;
        }

        h2 {
            font-size: 2.2em;
            color: var(--primary-color);
            margin-bottom: 0.6em;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.2em;
        }

        h3 {
            font-size: 1.6em;
            color: var(--heading-color);
            margin-bottom: 0.4em;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            font-size: 1.3em;
            line-height: 1.8;
            padding-left: 1.2em;
            position: relative;
            margin-bottom: 0.3em;
        }

        ul li::before {
            content: "▸";
            color: var(--primary-color);
            position: absolute;
            left: 0;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 0.8em;
        }

        /* ===== Code Block ===== */
        pre {
            background: var(--code-bg);
            border-radius: 8px;
            padding: 1em 1.2em;
            overflow-x: auto;
            font-size: 0.95em;
            margin: 1em 0;
        }

        code {
            font-family: "Fira Code", "Consolas", monospace;
            color: #a5d6ff;
        }

        /* ===== Images ===== */
        .slide img {
            max-width: 80%;
            max-height: 60vh;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            margin: 0.5em auto;
        }

        .slide img:hover {
            transform: scale(1.02);
        }

        /* ===== Image Overlay (Lightbox) ===== */
        .img-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .img-overlay.visible {
            display: flex;
        }

        .img-overlay img {
            max-width: 95%;
            max-height: 95vh;
            border-radius: 4px;
        }

        /* ===== Progress Bar ===== */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--primary-color);
            transition: width 0.3s ease;
            z-index: 100;
        }

        .page-indicator {
            position: fixed;
            bottom: 12px;
            right: 20px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.5);
            z-index: 100;
        }

        /* ===== Screen Reader Only ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .slide {
                padding: 30px 20px;
            }
            h1 { font-size: 2em; }
            h2 { font-size: 1.6em; }
            ul li { font-size: 1.1em; }
            .slide img { max-width: 95%; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6em; }
            h2 { font-size: 1.3em; }
            ul li { font-size: 1em; }
        }
    </style>
</head>
<body>
    <!-- Presentation Title (for accessibility) -->
    <h1 class="sr-only">{{TITLE}}</h1>

    <!-- Slide Container -->
    <div class="slide-container">
{{SLIDES}}
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>
    <div class="page-indicator" id="pageIndicator"></div>

    <!-- Image Overlay -->
    <div class="img-overlay" id="imgOverlay">
        <img id="overlayImg" src="" alt="enlarged">
    </div>

    <script>
        // ===== State Management =====
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        const progressBar = document.getElementById('progressBar');
        const pageIndicator = document.getElementById('pageIndicator');
        const imgOverlay = document.getElementById('imgOverlay');
        const overlayImg = document.getElementById('overlayImg');

        // ===== Navigation =====
        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = index;
            slides[currentSlide].classList.add('active');
            updateProgress();
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            goToSlide(currentSlide - 1);
        }

        // ===== Progress Update =====
        function updateProgress() {
            const progress = ((currentSlide + 1) / totalSlides) * 100;
            progressBar.style.width = progress + '%';
            pageIndicator.textContent = (currentSlide + 1) + ' / ' + totalSlides;
        }

        // ===== Keyboard Events =====
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowRight':
                case ' ':
                    e.preventDefault();
                    nextSlide();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case 'Escape':
                    closeOverlay();
                    break;
            }
        });

        // ===== Fullscreen Toggle =====
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // ===== Image Click to Enlarge =====
        document.querySelectorAll('.slide img').forEach(function(img) {
            img.addEventListener('click', function() {
                overlayImg.src = this.src;
                imgOverlay.classList.add('visible');
            });
        });

        imgOverlay.addEventListener('click', closeOverlay);

        function closeOverlay() {
            imgOverlay.classList.remove('visible');
        }

        // ===== Initialize =====
        updateProgress();
    </script>
</body>
</html>
